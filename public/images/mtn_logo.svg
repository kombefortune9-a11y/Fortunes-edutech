<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Vibrant MTN Yellow Background -->
  <rect width="500" height="500" fill="#FFC700"/>

  <!-- Center MoMo Deep Teal / Navy Tile -->
  <g transform="translate(142, 60)">
    <!-- Base Rounded Square -->
    <rect width="216" height="216" rx="42" fill="#004F71"/>
    <!-- Yellow Accent Line at bottom of tile -->
    <path d="M 0 178 Q 0 216 42 216 L 174 216 Q 216 216 216 178 L 216 186 Q 216 216 174 216 L 42 216 Q 0 216 0 186 Z" fill="#FFC700"/>
    <rect x="0" y="186" width="216" height="16" fill="#FFC700"/>
    <rect x="3" y="196" width="210" height="17" rx="10" fill="#FFC700"/>

    <!-- Dynamic MoMo Yellow Icon Inside Tile -->
    <!-- Main Sail / Folded Shape -->
    <path d="M 46 116 L 86 52 C 92 42 104 36 118 36 C 104 58 108 92 120 134 C 92 138 68 132 46 116 Z" fill="#FFC700"/>
    <!-- Navy Center Circle Inside Sail -->
    <circle cx="89" cy="85" r="16" fill="#004F71"/>
    <!-- Secondary Curved Wing -->
    <path d="M 120 54 C 130 76 130 106 122 134 C 132 118 134 88 128 62 C 126 58 123 55 120 54 Z" fill="#FFC700"/>
  </g>

  <!-- "MoMo" Brand Name in Deep Teal/Navy -->
  <text x="250" y="388" font-family="'Century Gothic', 'Tw Cen MT', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="108" fill="#004F71" text-anchor="middle" letter-spacing="-2">MoMo</text>

  <!-- "from MTN" Sub-branding in Deep Teal/Navy -->
  <text x="250" y="438" font-family="'Century Gothic', 'Tw Cen MT', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#004F71" text-anchor="middle" letter-spacing="1.2">from MTN</text>
</svg>
