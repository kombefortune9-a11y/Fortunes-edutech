<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgRadial" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0a522c" />
      <stop offset="50%" stop-color="#05361c" />
      <stop offset="100%" stop-color="#021d10" />
    </radialGradient>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cf519" />
      <stop offset="100%" stop-color="#65db00" />
    </linearGradient>

    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facetGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#032614" />
      <stop offset="100%" stop-color="#064222" />
    </linearGradient>

    <!-- Filters for crisp glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="960" height="540" fill="url(#bgRadial)" />

  <!-- 2. Geometric Crystal Facets -->
  <g opacity="0.9">
    <!-- Top-left faceted triangles -->
    <polygon points="0,0 340,0 160,260" fill="url(#facetGrad1)" />
    <polygon points="0,0 0,380 180,240" fill="#044825" opacity="0.4" />
    <polygon points="160,260 340,0 440,160" fill="#10b981" opacity="0.15" />

    <!-- Top-right faceted triangles -->
    <polygon points="620,0 960,0 820,240" fill="url(#facetGrad2)" />
    <polygon points="820,240 960,0 960,360" fill="#065f46" opacity="0.35" />
    <polygon points="540,140 760,0 820,240" fill="#34d399" opacity="0.18" />

    <!-- Bottom shards -->
    <polygon points="0,360 220,540 0,540" fill="#059669" opacity="0.25" />
    <polygon points="740,540 960,340 960,540" fill="url(#facetGrad1)" />
  </g>

  <!-- Central Ambient Backlight -->
  <circle cx="480" cy="200" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- 3. Central Logo Mark: Graduation Cap + Highway 'F' -->
  <g id="logoMark" transform="translate(0, 0)">
    <polygon points="480,72 558,110 480,148 402,110" fill="#FFFFFF" />
    <polygon points="480,72 402,110 480,148" fill="#F1F5F9" />
    <path d="M 436,128 Q 480,152 524,128 L 524,142 Q 480,166 436,142 Z" fill="#E2E8F0" />
    <path d="M 480,105 Q 436,108 424,136 L 424,170" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <ellipse cx="424" cy="174" rx="4.5" ry="6" fill="#FFFFFF" />

    <path d="M 386,275 C 400,225 432,175 464,152 L 484,152 C 454,178 428,222 414,275 Z" fill="#FFFFFF" />
    <path d="M 414,275 C 428,222 454,178 484,152 L 504,152 C 480,180 458,224 446,275 Z" fill="url(#roadGrad)" />
    <polygon points="428,275 438,275 446,252 437,252" fill="url(#limeGrad)" />
    <polygon points="443,246 451,246 458,228 451,228" fill="url(#limeGrad)" />
    <polygon points="456,222 462,222 468,206 462,206" fill="url(#limeGrad)" />
    <polygon points="466,200 471,200 475,188 471,188" fill="url(#limeGrad)" />

    <path d="M 488,152 L 566,152 C 584,152 590,165 578,178 C 564,192 538,200 496,200 L 476,200 C 482,185 486,168 488,152 Z" fill="url(#limeGrad)" />
    <path d="M 456,220 C 490,220 545,224 545,248 C 545,264 528,275 490,275 L 468,275 C 462,254 458,236 456,220 Z" fill="url(#limeGrad)" />
  </g>

  <!-- 4. TYPOGRAPHY: FORTUNES EDUTECH followed directly by plan competently. -->
  <text x="480" y="345" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="8">FORTUNES</text>

  <text x="480" y="410" 
        text-anchor="middle" 
        fill="#76E000" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" 
        font-size="54" 
        font-weight="900" 
        letter-spacing="9">EDUTECH</text>

  <!-- Slogan 'plan competently.' FOLLOWING FORTUNES EDUTECH -->
  <text x="480" y="450" 
        text-anchor="middle" 
        fill="#34D399" 
        font-family="system-ui, -apple-system, 'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="5">plan competently.</text>

  <!-- 5. VERSION AT THE RIGHT CORNER ALONE -->
  <g id="versionBadge" transform="translate(930, 500)">
    <rect x="-160" y="-16" width="150" height="32" rx="16" 
          fill="#032615" 
          stroke="#76E000" 
          stroke-width="1.8" 
          stroke-opacity="0.9" />
    <circle cx="-140" cy="0" r="4.5" fill="#76E000" />
    <circle cx="-140" cy="0" r="2.5" fill="#FFFFFF" />
    <text x="-72" y="5" 
          text-anchor="middle" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="900" 
          letter-spacing="2.5">VERSION 2.4.0</text>
  </g>
</svg>